  - name: mst_stock_item
    collection: StockItem
    nature: Primary
    fetch:
      - GstDetails,PartNo
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:StockGroup:$Parent
        type: text
      - name: category
        field: if ($$IsEmpty:$Category or $$IsEqual:$Category:$$SysName:NotApplicable) then "" else $Category
        type: text
      - name: _category
        field: if ($$IsEmpty:$Category or $$IsEqual:$Category:$$SysName:NotApplicable) then "" else $Guid:StockCategory:$Category
        type: text
      - name: alias
        field: OnlyAlias
        type: text
      - name: description
        field: Description
        type: text
      - name: notes
        field: Narration
        type: text
      - name: part_number
        field: PartNo
        type: text
      - name: uom
        field: if ($$IsEmpty:$BaseUnits or $$IsEqual:$BaseUnits:$$SysName:NotApplicable) then "" else $BaseUnits
        type: text
      - name: _uom
        field: if ($$IsEmpty:$BaseUnits or $$IsEqual:$BaseUnits:$$SysName:NotApplicable) then "" else $Guid:Unit:$BaseUnits
        type: text
      - name: alternate_uom
        field: if ($$IsEmpty:$AdditionalUnits or $$IsEqual:$AdditionalUnits:$$SysName:NotApplicable) then "" else $AdditionalUnits
        type: text
      - name: _alternate_uom
        field: if ($$IsEmpty:$AdditionalUnits or $$IsEqual:$AdditionalUnits:$$SysName:NotApplicable) then "" else $Guid:Unit:$AdditionalUnits
        type: text
      - name: conversion
        field: Conversion
        type: number
      - name: opening_balance
        field: OpeningBalance
        type: quantity
      - name: opening_rate
        field: OpeningRate
        type: rate
      - name: opening_value
        field: OpeningValue
        type: amount
      - name: closing_balance
        field: ClosingBalance
        type: quantity
      - name: closing_rate
        field: ClosingRate
        type: rate
      - name: closing_value
        field: ClosingValue
        type: amount
      - name: costing_method
        field: CostingMethod
        type: text
      - name: gst_type_of_supply
        field: GSTMSTTypeofSupply
        type: text
      - name: gst_hsn_code
        field: InfGSTHSNCode
        type: text
      - name: gst_hsn_description
        field: InfGSTHSNDescription
        type: text
      - name: gst_rate
        field: InfGSTIGSTRate
        type: number
      - name: gst_taxability
        field: InfGSTTaxablility
        type: text
    cascade_update:
      - table: trn_inventory
        field: item
      - table: trn_batch
        field: item
transaction:
  - name: trn_voucher
    order_details: true
    collection: Voucher
    nature: Primary
    fetch:
      - AlterId,Narration,PartyLedgerName,PlaceOfSupply,Reference,ReferenceDate,InvoiceOrderList.*
    filters:
      - NOT $IsCancelled
      - NOT $IsOptional
      - ($$IsInventoryVch:$VoucherTypeName OR $VoucherTypeName = "Sales")
    # Tally evaluates all three filters together pathologically: measured 146.6s combined against
    # 10.7s without the inventory-voucher test, on identical data. The diff scan only needs to spot
    # deleted and modified vouchers, and a superset filter cannot cause a false delete, so the
    # expensive test is dropped here and kept on the real export above.
    diff_filters:
      - NOT $IsCancelled
      - NOT $IsOptional
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: date
        field: Date
        type: date
      - name: voucher_type
        field: VoucherTypeName
        type: text
      - name: _voucher_type
        field: $Guid:VoucherType:$VoucherTypeName
        type: text
      - name: voucher_number
        field: VoucherNumber
        type: text
      - name: reference_number
        field: Reference
        type: text
      - name: reference_date
        field: ReferenceDate
        type: date
      - name: narration
        field: Narration
        type: text
      - name: party_name
        field: PartyLedgerName
        type: text
      - name: _party_name
        field: if $$IsEmpty:$PartyLedgerName then "" else $Guid:Ledger:$PartyLedgerName
        type: text
      - name: place_of_supply
        field: PlaceOfSupply
        type: text
      - name: is_invoice
        field: IsInvoice
        type: logical
      - name: is_accounting_voucher
        field: if $$IsAccountingVch:$VoucherTypeName then 1 else 0
        type: logical
      - name: is_inventory_voucher
        field: if $$IsInventoryVch:$VoucherTypeName then 1 else 0
        type: logical
      - name: is_order_voucher
        field: if $$IsOrderVch:$VoucherTypeName then 1 else 0
        type: logical
      - name: order_details
        field: '"KE_COMPUTED"'
        type: text
      - name: order_number
        field: '"KE_COMPUTED"'
        type: text
