master:
  - name: mst_group
    collection: Group
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:Group:$Parent
        type: text
      - name: primary_group
        field: _PrimaryGroup
        type: text
      - name: is_revenue
        field: IsRevenue
        type: logical
      - name: is_deemedpositive
        field: IsDeemedPositive
        type: logical
      - name: is_reserved
        field: IsReserved
        type: logical
      - name: affects_gross_profit
        field: AffectsGrossProfit
        type: logical
      - name: sort_position
        field: SortPosition
        type: number
    cascade_update:
      - table: mst_group
        field: parent
      - table: mst_ledger
        field: parent
  - name: mst_ledger
